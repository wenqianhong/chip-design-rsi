[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipbench"
version = "0.1.0"
description = "Local Linux VM experiments for coding agents"
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0"]

[project.scripts]
chipbench = "chipbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
